# Save this file as: .github/workflows/metrics.yml
# in your SMAthar/SMAthar profile repo.
#
# One-time setup:
# 1. Create a classic Personal Access Token at
#    https://github.com/settings/tokens/new  (no scopes needed for public data;
#    tick "repo" only if you want private-repo stats included)
# 2. In SMAthar/SMAthar → Settings → Secrets and variables → Actions →
#    New repository secret → Name: METRICS_TOKEN → paste the token
# 3. Commit this file. Run it once manually from the Actions tab
#    (workflow_dispatch) — it will commit github-metrics.svg to the repo.

name: Generate profile metrics
on:
  schedule:
    - cron: "0 6 * * *"   # refresh daily at 06:00 UTC
  workflow_dispatch:       # allow manual runs
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: General stats + languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SMAthar
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
